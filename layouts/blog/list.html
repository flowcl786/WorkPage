{{ define "main" }}
<div class="wrap">
  <div class="page-head"><span class="crumb"><a href="/">← Home</a></span><h1>{{ .Title }}</h1>{{ with .Params.lede }}<p class="lede">{{ . }}</p>{{ end }}</div>
</div>
<section class="section"><div class="wrap">
  <div class="writing">
    {{ range .Site.RegularPages.ByDate.Reverse }}{{ if eq .Section "blog" }}
    <a href="{{ .RelPermalink }}"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2 Jan 2006" }}</time><h3>{{ .Title }}</h3></a>
    {{ end }}{{ end }}
  </div>
</div></section>
{{ end }}
